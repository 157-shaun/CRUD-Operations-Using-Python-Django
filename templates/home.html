
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #ede9fe);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 45px 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            text-align: center;
            width: 90%;
            max-width: 480px;
        }

        h1 {
            color: #1e293b;
            margin-bottom: 12px;
        }

        p {
            color: #64748b;
            margin-bottom: 30px;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .btn {
            padding: 15px;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.25s ease,
                        box-shadow 0.25s ease,
                        background 0.25s ease;
        }

        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.18);
        }

        .create {
            background: #16a34a;
        }

        .create:hover {
            background: #15803d;
        }

        .update {
            background: #2563eb;
        }

        .update:hover {
            background: #1d4ed8;
        }

        .delete {
            background: #dc2626;
        }

        .delete:hover {
            background: #b91c1c;
        }

        .display {
            background: #9333ea;
        }

        .display:hover {
            background: #7e22ce;
        }

        @media (max-width: 360px) {
            .buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Student Management</h1>
        <p>Choose an operation to continue</p>

        <div class="buttons">
            <a href="/create" class="btn create">
                 ADD
            </a>

            <a href="/update-list" class="btn update">
                 Update
            </a>

            <a href="/delete" class="btn delete">
                 Delete
            </a>

            <a href="/display" class="btn display">
                 Display
            </a>
        </div>
    </div>
</body>
</html>
