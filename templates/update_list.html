<!DOCTYPE html>
<html>

<head>
    <title>Delete Students</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #263445;
        }

        table {
            width: 100%;
            max-width: 900px;
            margin: 25px auto;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 4px 12px #00000015;
            border-radius: 10px;
            overflow: hidden;
        }

        th,
        td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #263445;
            color: white;
        }

        tr:hover {
            background: #f8fafc;
        }

        .delete-btn {
            background: #e53935;
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #b71c1c;
        }
    </style>
</head>

<body>

    <h1>Student Details</h1>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Course</th>
            <th>Price</th>
            <th>Action</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student.id }}</td>
            <td>{{ student.name }}</td>
            <td>{{ student.course }}</td>
            <td>{{ student.price }}</td>
            <td>
                <form method="GET" action="{% url 'update' student.id %}">
                    {% csrf_token %}
                    <button type="submit" class="delete-btn">
                        Update
                    </button>
                </form>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="5">No students found.</td>
        </tr>
        {% endfor %}
    </table>
   {% if message %}
   <script>
        alert("{{message}}")
   </script>
   {% endif %}

</body>

</html>
